name: PFI content scout

on:
  schedule:
    - cron: "15 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pfi-content-scout
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Recolher candidatos e atualizar a galeria
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ID: ${{ secrets.TELEGRAM_ID }}
          PFI_GALLERY_URL: ${{ vars.PFI_GALLERY_URL }}
        run: python scripts/collect.py

      - name: Guardar a fila de revisão
        run: |
          git config user.name 'PFI Content Scout'
          git config user.email 'pfi-content-scout@users.noreply.github.com'
          if [[ -n $(git status --porcelain data docs) ]]; then
            git add data docs
            git commit -m "Atualizar candidatos PFI [skip ci]"
            git push
          fi
